name: CI

on:
  push:
    branches: [main, redesgindashboard]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dizruptos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dizruptos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm test -- --reporter=verbose --coverage
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: dizruptos/coverage/
          retention-days: 14

      - name: Production build (demo mode)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production

      - name: Build size report
        run: |
          echo "## Build sizes" >> $GITHUB_STEP_SUMMARY
          du -sh .next/static/ >> $GITHUB_STEP_SUMMARY || true

  migration-lint:
    name: SQL migration lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration ordering
        run: |
          # Ensure migrations are sequentially numbered with no gaps.
          ls dizruptos/supabase/migrations/*.sql | sort | \
            awk -F'/' '{n=substr($NF,1,4)+0; if(n!=prev+1 && prev!="") { print "Gap at " $NF; exit 1 } prev=n}'
          echo "Migration ordering OK"

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dizruptos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dizruptos/package-lock.json
      - run: npm ci
      - name: npm audit (high+critical)
        run: npm audit --audit-level=high --production
        continue-on-error: true  # report, don't block; tighten after first clean pass

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dizruptos
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dizruptos/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Run E2E smoke tests
        run: npm run e2e || true  # non-blocking until suite is complete
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: dizruptos/playwright-report/
          retention-days: 7
