name: CI

on:
  push:
    branches: [master, main]
  pull_request:

defaults:
  run:
    working-directory: dizruptos

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dizruptos/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (product laws)
        run: npm test
      - name: Production build
        run: npm run build
